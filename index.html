<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GhaziAbad Tanzeem</title>
<meta name="theme-color" content="#1F4E3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tanzeem">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1F4E3D; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #EEF2EE; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px;
            background: #1F4E3D; color: #fff; font: 600 20px/1.4 system-ui, sans-serif; text-align: center; transition: opacity .3s; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; }
  #splash .hint { font-weight: 400; font-size: 14px; opacity: .8; max-width: 300px; }
  #splash a { color: #F3D27A; }
  .hide { opacity: 0; pointer-events: none; }
  #inst { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 10; display: flex; align-items: center; gap: 10px;
          background: #fff; color: #14231C; border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25); font: 14px/1.35 system-ui, sans-serif; }
  #inst img { width: 40px; height: 40px; border-radius: 10px; flex: 0 0 40px; }
  #inst .t { flex: 1; min-width: 0; }
  #inst b { display: block; font-size: 15px; }
  #inst button { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; }
  #instGo { background: #1F4E3D; color: #fff; }
  #instX { background: transparent; color: #5B6B62; padding: 6px 8px !important; font-size: 18px !important; }
  #inst[hidden] { display: none; }
  #shr { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); font: 15px/1.4 system-ui, sans-serif; }
  #shr[hidden] { display: none; }
  #shr .card { width: 100%; max-width: 520px; background: #fff; color: #14231C; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(0,0,0,.2); }
  #shr b { display: block; font-size: 18px; margin-bottom: 4px; }
  #shr .sub { color: #5B6B62; font-size: 14px; }
  #shr img { display: block; width: 100%; max-height: 38vh; object-fit: contain; object-position: top; border-radius: 12px; border: 1px solid #E2E8E4; margin: 12px 0; background: #F6F8F6; }
  #shrGo { width: 100%; border: 0; border-radius: 14px; padding: 16px; background: #25A35A; color: #fff; font: 700 17px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #shrX { width: 100%; border: 0; background: transparent; color: #5B6B62; font: 600 15px system-ui, sans-serif; padding: 12px; margin-top: 4px; }
</style>
</head>
<body>
<!-- ============ PASTE YOUR GOOGLE WEBSITE LINK BELOW (the one ending in /exec) ============ -->
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwyIiGBHUcdU9WxGVJYatcu9KPFd5zlOVf8wpPXDwewefQ2Q46ZWWw09alqr8yc6IOraA/exec';
</script>
<!-- ======================================================================================= -->

<div id="splash"><img src="icon-192.png" alt=""><div>GhaziAbad Tanzeem</div><div class="hint" id="hint">Loading…</div></div>
<div id="inst" hidden><img src="icon-192.png" alt=""><div class="t"><b>Install Tanzeem app</b><span id="instTxt">Open it like WhatsApp, from your home screen.</span></div>
  <button type="button" id="instGo" hidden>Install</button><button type="button" id="instX" aria-label="Close">✕</button></div>
<div id="shr" hidden><div class="card"><b>Picture ready</b><div class="sub" id="shrSub"></div><img id="shrImg" alt="">
  <button type="button" id="shrGo">Share on WhatsApp</button><button type="button" id="shrX">Cancel</button></div></div>
<iframe id="app" title="GhaziAbad Tanzeem" allow="clipboard-write; camera; web-share" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  const frame = document.getElementById('app'), splash = document.getElementById('splash'), hint = document.getElementById('hint');
  if (!APP_URL || APP_URL.indexOf('/exec') < 0) {
    hint.textContent = 'Setup needed: paste the website link into index.html (APP_URL).';
  } else {
    frame.src = APP_URL;
    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 400));
    setTimeout(() => { if (!splash.classList.contains('hide')) hint.innerHTML = 'Still loading… check your internet.<br><a href="' + APP_URL + '">Open in browser</a>'; }, 20000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  /* Share pictures to WhatsApp for the app (the share menu only works from this top page). Version 3. */
  function dataUrlToFile(url, name) {
    const b64 = url.split(',')[1], bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new File([arr], name, { type: 'image/png' });
  }
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.type !== 'tz-share') return;
    let host = ''; try { host = new URL(e.origin).hostname; } catch (err) {}
    if (!/\.googleusercontent\.com$/.test(host)) return;
    const reply = (type, extra) => { try { e.source.postMessage(Object.assign({ type, id: d.id }, extra || {}), '*'); } catch (err) {} };
    reply('tz-share-ack');
    let files;
    try { files = (d.files || []).map(f => dataUrlToFile(f.url, f.name)); } catch (err) { reply('tz-share-result', { ok: false, err: 'read: ' + err.message }); return; }
    if (!navigator.share) { reply('tz-share-result', { ok: false, err: 'share menu not available in this browser' }); return; }
    if (navigator.canShare && !navigator.canShare({ files })) { reply('tz-share-result', { ok: false, err: 'this phone cannot share pictures from the app' }); return; }
    const data = { files, text: d.text || '' };
    const active = !navigator.userActivation || navigator.userActivation.isActive;
    if (!active) { askTap(data, d.files, reply); return; }
    navigator.share(data)
      .then(() => reply('tz-share-result', { ok: true }))
      .catch(err => {
        if (err && err.name === 'NotAllowedError') { askTap(data, d.files, reply); return; }
        reply('tz-share-result', { ok: err && err.name === 'AbortError', err: err && (err.name + ': ' + err.message) });
      });
  });
  /* The phone allows the share menu only right after a tap, so ask for one tap here. */
  const shr = document.getElementById('shr');
  function askTap(data, raw, reply) {
    document.getElementById('shrImg').src = raw[0].url;
    document.getElementById('shrSub').textContent = raw.length > 1 ? raw.length + ' pictures' : '';
    shr.hidden = false;
    reply('tz-share-result', { ok: true });
    document.getElementById('shrGo').onclick = () => { shr.hidden = true; navigator.share(data).catch(() => {}); };
    document.getElementById('shrX').onclick = () => { shr.hidden = true; };
  }

  /* Install banner: shown only in the browser, never inside the installed app */
  const inst = document.getElementById('inst'), go = document.getElementById('instGo'), txt = document.getElementById('instTxt');
  const installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  let dismissed = false; try { dismissed = localStorage.getItem('tz_inst_x') === '1'; } catch (e) {}
  let promptEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptEvt = e; if (!installed && !dismissed) { go.hidden = false; inst.hidden = false; } });
  go.onclick = async () => { if (!promptEvt) return; promptEvt.prompt(); const r = await promptEvt.userChoice; promptEvt = null; inst.hidden = true; };
  document.getElementById('instX').onclick = () => { inst.hidden = true; try { localStorage.setItem('tz_inst_x', '1'); } catch (e) {} };
  window.addEventListener('appinstalled', () => { inst.hidden = true; });
  if (!installed && !dismissed) setTimeout(() => {
    if (promptEvt || !inst.hidden) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    txt.textContent = ios ? 'In Safari: tap Share, then "Add to Home Screen".'
      : 'Open this link in Google Chrome, then tap the 3 dots and "Install app" (or "Add to Home screen").';
    inst.hidden = false;
  }, 5000);
</script>
</body>
</html>
